# macOS 13 Ventura: modernization target. RESEARCH until the Monterey baseline is verified.
#
# What changes from Monterey (sources: Dortania extras/ventura.md, WhateverGreen FAQ.IntelHD):
#  * CPU: Ventura needs AVX2. The i7-6770HQ (Skylake) has AVX2, so no CryptexFixup is needed.
#  * SMBIOS: iMac17,1 was dropped. Dortania: "desktops with unsupported iGPUs should use
#    iMac18,1" (also its Kaby Lake "NUC Systems" SMBIOS). iMac18,1's last OS is 13.6.x.
#  * Graphics: Skylake drivers removed. Kaby Lake spoof via WhateverGreen (config-overlay.plist).
#  * Wi-Fi: AirportItlwm has a Ventura-specific build (v2.3.0).
#
# Open questions (docs/dev/backlog.md B-040): does any KBL spoof give working Metal on GT4e? Do
# HDMI 2.0 (LSPCON) and wake behave the same as on Monterey?

[profile]
title = "macOS 13 Ventura"
status = "research"
darwin = 22
smbios_model = "iMac18,1"
overlays = ["../_common/config-overlay.plist", "config-overlay.plist"]
debug_overlays = ["../_common/config-overlay.debug.plist"]
usb_map = "../../hardware/usb/nuc6i7kyb.toml"
boot_args = ["forceRenderStandby=0"]
debug_boot_args = ["-v", "keepsyms=1", "debug=0x100", "msgbuf=1048576", "-liludbgall"]

[features]
bluetooth = true
wifi = "none"
fat32_installer = false
nvmefix = false

[feature_overlays]
fat32_installer = ["../_common/overlay-fat32-installer.plist"]

[feature_choices]
wifi = ["none", "airportitlwm", "itlwm"]

[[acpi]]
name = "SSDT-PLUG.aml"

[[acpi]]
name = "SSDT-EC-USBX.aml"

[[kexts]]
name = "Lilu"

[[kexts]]
name = "VirtualSMC"

[[kexts]]
name = "SMCProcessor"

[[kexts]]
name = "WhateverGreen"

[[kexts]]
name = "AppleALC"

[[kexts]]
name = "IntelMausi"

[[kexts]]
name = "USBMap"

[[kexts]]
name = "NVMeFix"
when = "nvmefix"

[[kexts]]
name = "IntelBluetoothFirmware"
when = "bluetooth"

[[kexts]]
name = "IntelBTPatcher"
when = "bluetooth"

[[kexts]]
name = "BlueToolFixup"
when = "bluetooth"

[[kexts]]
name = "AirportItlwm-Ventura"
when = "wifi=airportitlwm"

[[kexts]]
name = "itlwm"
when = "wifi=itlwm"

[[drivers]]
name = "OpenHfsPlus.efi"

[[drivers]]
name = "OpenRuntime.efi"

[[drivers]]
name = "ResetNvramEntry.efi"
comment = "Reset NVRAM picker entry"
# --preserve-boot: without it, OpenCore's NVRAM reset also deletes the firmware boot entries for
# Windows Boot Manager and GRUB (OpenCore Configuration.pdf, ResetNvramEntry).
arguments = "--preserve-boot"

[[tools]]
name = "OpenShell.efi"
flavors = ["debug"]

[[tools]]
name = "ControlMsrE2.efi"
flavors = ["debug"]
