# macOS 15 Sequoia: RESEARCH (advanced target).
#
# Known changes:
#  * SMBIOS: needs a model whose last OS is "Current" in Dortania's table, e.g. iMac19,1 or
#    Macmini8,1 (both Coffee Lake). iMac19,1 is the starting point (also used by zearp/Nucintosh).
#  * Wi-Fi: OpenIntelWireless v2.3.0 ships NO AirportItlwm build for Sequoia. Only the generic
#    itlwm (with the HeliPort app) is available from an official release.
#  * Graphics: whether a Kaby Lake spoof still finds its framebuffer driver on 15.x is an OPEN
#    QUESTION (B-042). If it does not, the remaining routes are a Coffee Lake spoof (unknown
#    viability for GT4e) or OpenCore Legacy Patcher root patches. Root patching needs SIP
#    relaxation and an unsealed system volume; it will not be added silently (docs/compatibility.md).

[profile]
title = "macOS 15 Sequoia"
status = "research"
darwin = 24
smbios_model = "iMac19,1"
overlays = ["../_common/config-overlay.plist", "../ventura/config-overlay.plist"]
debug_overlays = ["../_common/config-overlay.debug.plist"]
usb_map = "../../hardware/usb/nuc6i7kyb.toml"
boot_args = ["forceRenderStandby=0"]
debug_boot_args = ["-v", "keepsyms=1", "debug=0x100", "msgbuf=1048576", "-liludbgall"]

[features]
bluetooth = true
wifi = "none"
fat32_installer = false
nvmefix = false

[feature_overlays]
fat32_installer = ["../_common/overlay-fat32-installer.plist"]

[feature_choices]
wifi = ["none", "itlwm"]

[[acpi]]
name = "SSDT-PLUG.aml"

[[acpi]]
name = "SSDT-EC-USBX.aml"

[[kexts]]
name = "Lilu"

[[kexts]]
name = "VirtualSMC"

[[kexts]]
name = "SMCProcessor"

[[kexts]]
name = "WhateverGreen"

[[kexts]]
name = "AppleALC"

[[kexts]]
name = "IntelMausi"

[[kexts]]
name = "USBMap"

[[kexts]]
name = "NVMeFix"
when = "nvmefix"

[[kexts]]
name = "IntelBluetoothFirmware"
when = "bluetooth"

[[kexts]]
name = "IntelBTPatcher"
when = "bluetooth"

[[kexts]]
name = "BlueToolFixup"
when = "bluetooth"

[[kexts]]
name = "itlwm"
when = "wifi=itlwm"

[[drivers]]
name = "OpenHfsPlus.efi"

[[drivers]]
name = "OpenRuntime.efi"

[[drivers]]
name = "ResetNvramEntry.efi"
comment = "Reset NVRAM picker entry"
# --preserve-boot: without it, OpenCore's NVRAM reset also deletes the firmware boot entries for
# Windows Boot Manager and GRUB (OpenCore Configuration.pdf, ResetNvramEntry).
arguments = "--preserve-boot"

[[tools]]
name = "OpenShell.efi"
flavors = ["debug"]

[[tools]]
name = "ControlMsrE2.efi"
flavors = ["debug"]
