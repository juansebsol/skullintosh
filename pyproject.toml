[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skullintosh"
version = "0.1.0.dev0"
description = "Reproducible, validated OpenCore builds for the Intel NUC6i7KYK (Skull Canyon)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skullintosh = "skullintosh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads pinned release assets (run with -m network)"]
addopts = "-m 'not network'"
