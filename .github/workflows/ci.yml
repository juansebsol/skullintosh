# Static checks for every pull request.
#
# CI proves the EFI is well-formed, reproducible and built from pinned, checksummed releases.
# It CANNOT prove that anything boots: hardware status lives in docs/compatibility.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: ShellCheck
        run: shellcheck scripts/**/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Unit tests (plists, manifest, profiles, validator, secrets, docs links)
        run: pytest -q
      - name: Secret scan
        run: skullintosh scan-secrets

  build-validate:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Cache pinned release assets
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: deps-${{ hashFiles('manifests/dependencies.toml') }}
      - name: Fetch and verify every pinned asset (fails on any checksum mismatch)
        run: skullintosh fetch
      - name: Doctor
        run: skullintosh doctor
      - name: End-to-end builds, ocvalidate, reproducibility, packaging rules
        run: pytest -q -m network
      - name: Build and validate Monterey (release + debug) with the matching ocvalidate
        run: |
          skullintosh build --target monterey --flavor release --ocvalidate require
          skullintosh build --target monterey --flavor debug --ocvalidate require
      - name: Build research profiles (experiments only)
        run: |
          for t in ventura sonoma sequoia tahoe; do
            skullintosh build --target "$t" --allow-research --ocvalidate require
          done
      - name: Reproducibility check (two clean builds must match)
        run: |
          skullintosh build --target monterey --no-validate --output /tmp/a | tail -1 > a.txt
          skullintosh build --target monterey --no-validate --output /tmp/b | tail -1 > b.txt
          diff a.txt b.txt
      - name: Package (candidate, unverified)
        run: skullintosh package --target monterey
      - name: Environment report
        run: skullintosh report >> "$GITHUB_STEP_SUMMARY"
