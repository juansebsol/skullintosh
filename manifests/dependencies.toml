# Skullintosh dependency manifest.
#
# Every binary in a Skullintosh EFI comes from one of the release assets below. Assets are
# downloaded from https://github.com/<repo>/releases/download/<tag>/<name> and must match the
# pinned SHA-256 exactly; anything else aborts the build.
#
# To update a dependency: change `tag`/`version`/asset names, clear the sha256, run
# `skullintosh pin <package>` (it downloads, hashes, and cross-checks GitHub's published digest
# where one exists), review the diff, and record the change in CHANGELOG.md.

schema = 1

# Release assets may only come from these GitHub owners.
approved_owners = ["acidanthera", "OpenIntelWireless"]

