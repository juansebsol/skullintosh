# --------------------------------------------------------------------------------------------
# Kexts: where each bundle lives inside its package, and which macOS releases it applies to.
#
#   asset       asset key to use; defaults to the build flavour ("release"/"debug")
#   darwin_min  first darwin major the kext is built for (21 = macOS 12 Monterey)
#   darwin_max  last darwin major the kext is built for
#   min_kernel  explicit MinKernel override (for point-release splits)
#   max_kernel  explicit MaxKernel override
#   group       mutually exclusive group: at most one enabled kext per group per kernel range
# --------------------------------------------------------------------------------------------

[kexts.Lilu]
package = "lilu"
path = "Lilu.kext"

[kexts.VirtualSMC]
package = "virtualsmc"
path = "Kexts/VirtualSMC.kext"

[kexts.SMCProcessor]
package = "virtualsmc"
path = "Kexts/SMCProcessor.kext"

[kexts.WhateverGreen]
package = "whatevergreen"
path = "WhateverGreen.kext"

[kexts.AppleALC]
package = "applealc"
path = "AppleALC.kext"

[kexts.IntelMausi]
package = "intelmausi"
path = "IntelMausi.kext"

[kexts.NVMeFix]
package = "nvmefix"
path = "NVMeFix.kext"

[kexts.IntelBluetoothFirmware]
package = "intelbluetooth"
asset = "any"
path = "IntelBluetoothFirmware.kext"

[kexts.IntelBTPatcher]
package = "intelbluetooth"
asset = "any"
path = "IntelBTPatcher.kext"

# Must NOT be used on macOS 12+ (BlueToolFixup replaces it); listed so the validator can
# recognise and reject it.
[kexts.IntelBluetoothInjector]
package = "intelbluetooth"
asset = "any"
path = "IntelBluetoothInjector.kext"
darwin_max = 20

[kexts.BlueToolFixup]
package = "brcmpatchram"
path = "BlueToolFixup.kext"
darwin_min = 21

[kexts.itlwm]
package = "itlwm"
asset = "itlwm"
path = "itlwm.kext"
group = "wifi"

[kexts.AirportItlwm-Monterey]
package = "itlwm"
asset = "airportitlwm-monterey"
path = "AirportItlwm.kext"
darwin_min = 21
darwin_max = 21
group = "wifi"

[kexts.AirportItlwm-Ventura]
